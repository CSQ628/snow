[package]
name = "ant-design-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Ant Design components for GPUI"

[dependencies]
# Keep the source, revision and features aligned with snow-draw-engine-gpui.
gpui = { git = "https://github.com/mg-chao/gpui.git", rev = "2c0bf70b54c018f99419f386d1cf1105dca57661", default-features = false, features = ["gpu-extensions"] }

[dev-dependencies]
gpui = { git = "https://github.com/mg-chao/gpui.git", rev = "2c0bf70b54c018f99419f386d1cf1105dca57661", default-features = false, features = ["gpu-extensions", "test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dev-dependencies]
gpui_platform = { git = "https://github.com/mg-chao/gpui.git", rev = "2c0bf70b54c018f99419f386d1cf1105dca57661", default-features = false, features = ["font-kit", "x11", "wayland", "gpu-extensions", "test-support"] }

[[bench]]
name = "foundation"
harness = false

[[bench]]
name = "button"
harness = false

[[bench]]
name = "checkbox"
harness = false

[[bench]]
name = "divider"
harness = false

[profile.dev]
incremental = false

[profile.test]
incremental = false
